# Ejemplo Nginx + certbot en la VM (puerto 443 → API local)

server {
    listen 443 ssl http2;
    server_name api.su-dominio.gob.ec;

    ssl_certificate     /etc/letsencrypt/live/api.su-dominio.gob.ec/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.su-dominio.gob.ec/privkey.pem;

    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}